# Shared dev container. How to use it: devenv/README.md
#   docker compose run --rm dev bash check.sh                                 any laptop, no GPU
#   docker compose --profile gpu run --rm gpu ./norev.sh /data/<clip>.wav ro  laptop 4
# Host folders: NOREV_HOST_DATA (dev data, default ../norev-data), NOREV_HOST_MODELS (default ../norev-models).
services:
  dev:
    build:
      context: .
      target: dev
    image: norev-dev
    volumes:
      - .:/workspace
      # shortcut: the image's .venv is copied into an anonymous volume on every run (a few seconds); it hides the
      # host's .venv and is never stale after a rebuild. Move it out of the repo if norev.sh ever reads PYTHON.
      - /workspace/.venv
      - ${NOREV_HOST_DATA:-../norev-data}:/data:ro
    environment:
      # unset unless the host sets it, e.g. LLAMACPP_URL=http://<laptop 4>:8080 (synthetic data only)
      - LLAMACPP_URL

  gpu:
    profiles: [gpu]
    build:
      context: .
      target: gpu
      args:
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-75;86;89;120}
    image: norev-gpu
    volumes:
      - .:/workspace
      - /workspace/.venv
      - ${NOREV_HOST_DATA:-../norev-data}:/data:ro
      # read-write: faster-whisper downloads its model into /models/huggingface on first use
      - ${NOREV_HOST_MODELS:-../norev-models}:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Web demo through ngrok (#63): the UI on synthetic data only, for showing it remotely.
  #   NGROK_AUTHTOKEN=... NOREV_DEMO_URL=https://<your-domain> docker compose --profile demo up
  # Put both in a local .env (gitignored), never in the repo. No /data, store, key or profile is mounted:
  # the server always runs the in-memory demo and listens on 127.0.0.1, shared only with ngrok.
  demo:
    profiles: [demo]
    build:
      context: .
      target: dev
    image: norev-dev
    entrypoint: ["python", "-m", "norev.ui.web_demo", "--port", "8765"]
    volumes:
      - .:/workspace:ro
      - /workspace/.venv
    environment:
      - PYTHONDONTWRITEBYTECODE=1

  ngrok:
    profiles: [demo]
    image: docker.io/ngrok/ngrok:3
    network_mode: service:demo
    depends_on: [demo]
    environment:
      - NGROK_AUTHTOKEN
    command: ["http", "--url=${NOREV_DEMO_URL:?set NOREV_DEMO_URL in your local .env}", "8765"]
